<script>
// ===== DATA (saved on this device in localStorage) =====
const K='bizapp1';let S={inv:[],pay:[],adv:[],log:{inv:[],pay:[],adv:[]},fs:18};
try{const x=JSON.parse(localStorage.getItem(K));if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),R=n=>'₹'+(+n||0).toLocaleString('en-IN'),iso=()=>new Date().toISOString().slice(0,10);
const fd=s=>{if(!s)return'-';const p=String(s).split('-');return +p[2]+'/'+ +p[1]+'/'+p[0].slice(2)},e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=(k,m)=>{const n=new Date();S.log[k].unshift(n.getDate()+'/'+(n.getMonth()+1)+'/'+String(n.getFullYear()).slice(2)+', '+n.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})+' — '+m)};
let tab='inv',q='',showH=false;
function go(t){tab=t;showH=false;render()}
function fz(d){S.fs=Math.min(34,Math.max(12,S.fs+d));save();document.documentElement.style.fontSize=S.fs+'px'}
// ===== POPUP FORM =====
const err=t=>{$('#err').textContent=t};
const szc=s=>{const t=$('#'+s.id+'_o');t.style.display=s.value=='__o'?'block':'none';if(s.value=='__o')t.focus()};
function form(title,f,v,cb){const m=$('#m');
m.innerHTML=`<div class=box><h2>${title}</h2>${f.map(a=>a[2]=='sel'||a[2]=='size'?`<label>${a[1]}<select id=f_${a[0]} ${a[2]=='size'?'onchange=szc(this)':''}>${(v[a[0]]&&!a[4].some(o=>o[0]==v[a[0]])?a[4].concat([[v[a[0]],v[a[0]]]]):a[4]).concat(a[2]=='size'?[['__o','Other (type size)']]:[]).map(o=>`<option value="${e(o[0])}" ${v[a[0]]!=null&&v[a[0]]!==''&&o[0]==v[a[0]]?'selected':''}>${e(o[1])}</option>`).join('')}</select>${a[2]=='size'?`<input id=f_${a[0]}_o placeholder="Type size, e.g. 55×65" style="display:none">`:''}</label>`:`<label>${a[1]}<input id=f_${a[0]} type=${a[2]} value="${e(v[a[0]]??'')}" ${a[2]=='number'?'min=0 step=any inputmode=decimal':''}></label>`).join('')}<p id=err class=err></p><button id=ok>Save</button><button id=no class=g>Cancel</button></div>`;
m.style.display='flex';$('#no').onclick=()=>m.style.display='none';
$('#ok').onclick=()=>{const o={};for(const a of f){let x=$('#f_'+a[0]).value.trim();if(x=='__o')x=$('#f_'+a[0]+'_o').value.trim();if(a[2]=='number'){if(x!==''&&+x<0)return err(a[1]+' cannot be negative');x=x===''?'':+x}if(a[3]&&x==='')return err(a[1]+' is required');o[a[0]]=x}
const r=cb(o);if(r)return err(r);m.style.display='none';save();render()}}
function ask(msg,cb){const m=$('#m');m.innerHTML=`<div class=box><h2>${e(msg)}</h2><button id=ok>Yes</button><button id=no class=g>No</button></div>`;m.style.display='flex';
$('#no').onclick=()=>m.style.display='none';$('#ok').onclick=()=>{m.style.display='none';cb();save();render()}}
// ===== INVENTORY =====
const SZO=[['','Select size']].concat(['40×45','45×45','45×50','45×55','50×60','50×72','60×60','60×80','72×72','72×80'].map(s=>[s,s]));
const IF=[['name','Material name','text',1],['size','Size','size',0,SZO],['units','Units','number',1],['price','Price per unit (₹)','number',1],['date','Date added','date']];
function invForm(i){form(i==null?'Add Item':'Edit Item',IF,i==null?{date:iso()}:S.inv[i],o=>{o.date=o.date||iso();
if(i==null){S.inv.push(o);log('inv',`ADDED ${o.name} ${o.size}: ${o.units} units @ ${R(o.price)}`)}
else{const p=S.inv[i];if(o.units!=p.units)log('inv',`STOCK ${o.units>p.units?'IN':'OUT'} ${Math.abs(o.units-p.units)} — ${p.name}: ${p.units} → ${o.units}`);
if(o.price!=p.price||o.name!=p.name||o.size!=p.size)log('inv',`EDITED ${p.name} (${p.size}, ${R(p.price)}) → ${o.name} (${o.size}, ${R(o.price)})`);Object.assign(p,o)}})}
function invDel(i){const p=S.inv[i];ask('Remove '+p.name+'?',()=>{log('inv',`REMOVED ${p.name} ${p.size}: ${p.units} units, value ${R(p.units*p.price)}`);S.inv.splice(i,1)})}
function addStock(name,size,qty,price){const p=S.inv.find(x=>x.name.toLowerCase()==name.toLowerCase()&&x.size==size);
if(p){p.units+=qty;log('inv',`STOCK IN ${qty} — ${name}: ${p.units-qty} → ${p.units}`)}else{S.inv.push({name,size,units:qty,price,date:iso()});log('inv',`ADDED ${name} ${size}: ${qty} units (from supplier)`)}}
// ===== PAYMENTS =====
const PF=[['name','Buyer name','text',1],['units','Units bought','number',1],['size','Material size','size',0,SZO],['rate','Rate per unit (₹)','number',1],['date','Date','date']];
function payForm(i){const add=i==null,f=add?PF.concat([['link','Reduce stock of (optional)','sel',0,[['','None']].concat(S.inv.map((x,j)=>[j,`${x.name} ${x.size} (stock ${x.units})`]))]]):PF;
form(add?'Add Payment':'Edit Payment',f,add?{date:iso()}:S.pay[i],o=>{o.date=o.date||iso();o.paid=add?0:S.pay[i].paid;const t=o.units*o.rate;if(o.paid>t)return'Total cannot be less than amount already received ('+R(o.paid)+')';
if(add){if(o.link!==''){const it=S.inv[o.link];if(o.units>it.units)return'Not enough stock (only '+it.units+')';it.units-=o.units;log('inv',`STOCK OUT ${o.units} — ${it.name}: sold to ${o.name}`)}delete o.link;o.done=o.paid>=t;S.pay.push(o);log('pay',`ADDED ${o.name}: ${R(t)}, paid ${R(o.paid)}`)}
else{const p=S.pay[i];log('pay',`EDITED ${p.name}: total ${R(p.units*p.rate)} → ${R(t)}, paid ${R(p.paid)} → ${R(o.paid)}`);Object.assign(p,o);p.done=p.paid>=t}})}
function payPart(i){const p=S.pay[i],b=p.units*p.rate-p.paid;form('Payment from '+p.name+' (balance '+R(b)+')',[['amt','Amount received (₹)','number',1]],{},o=>{if(o.amt>b)return'Cannot exceed balance '+R(b);p.paid+=o.amt;log('pay',`RECEIVED ${R(o.amt)} from ${p.name}`);if(p.paid>=p.units*p.rate){p.done=true;log('pay',`COMPLETED ${p.name}`)}})}
function payDone(i){const p=S.pay[i];ask('Mark '+p.name+' as completed?',()=>{p.paid=p.units*p.rate;p.done=true;log('pay',`COMPLETED ${p.name}: ${R(p.paid)}`)})}
// ===== ADVANCE (paid to suppliers) =====
const AF=[['sup','Supplier name','text',1],['size','Size','size',0,SZO],['qty','Quantity ordered','number',1],['amt','Advance paid (₹)','number',1],['date','Date paid','date']];
function advForm(i){form(i==null?'Add Advance':'Edit Advance',AF,i==null?{date:iso()}:S.adv[i],o=>{o.date=o.date||iso();
if(i==null){o.rec=0;o.done=false;S.adv.push(o);log('adv',`ADDED ${o.sup}: ${R(o.amt)} for ${o.qty} units (${o.size||'-'})`)}
else{const p=S.adv[i];if(o.qty<p.rec)return'Quantity cannot be less than received ('+p.rec+')';log('adv',`EDITED ${p.sup}`);Object.assign(p,o);p.done=p.rec>=p.qty}})}
function advRecv(i){const p=S.adv[i],b=p.qty-p.rec;form('Received from '+p.sup+' (pending '+b+')',[['q','Quantity received','number',1],['inv','Add to inventory?','sel',0,[['y','Yes'],['n','No']]]].concat(p.mat?[]:[['mn','Material name (needed to add to inventory)','text']]),{},o=>{if(!o.q)return'Enter quantity';if(o.q>b)return'Cannot exceed pending '+b;const nm=p.mat||o.mn;if(o.inv=='y'&&!nm)return'Enter material name to add to inventory';if(o.mn&&!p.mat)p.mat=o.mn;
p.rec+=o.q;log('adv',`RECEIVED ${o.q} units from ${p.sup}`);if(o.inv=='y')addStock(nm,p.size,o.q,p.amt/p.qty);if(p.rec>=p.qty){p.done=true;log('adv',`FULLY RECEIVED ${p.sup}`)}})}
// ===== SCREEN =====
const IH='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z"/></svg>',ID='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 -960 960 960" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>';
const row=(a,b)=>`<div>${a}: <b>${e(b)}</b></div>`,B=(t,f,c='')=>`<button class="${c}" onclick="${f}">${t}</button>`;
const tl=(a,b)=>`<div class=tl><small>${a}</small><b>${e(b)}</b></div>`;
function card(i,h){const x=S[tab][i];let t='',chip='',g='',b='';
if(tab=='inv'){t=x.name;g=tl('Size',x.size||'-')+tl('Units',x.units)+tl('Price / unit',R(x.price))+tl('Total price',R(x.units*x.price))+'';b=B('Edit',`invForm(${i})`,'bk')+B(ID,`invDel(${i})`,'rd ic')}
if(tab=='pay'){const T=x.units*x.rate;t=x.name;chip=`<span class="chip ${x.done?'G':'R'}">${x.done?'COMPLETED':'PENDING'}</span>`;g=tl('Units',x.units)+tl('Size',x.size||'-')+tl('Rate',R(x.rate))+tl('Total',R(T))+tl('Paid',R(x.paid))+tl('Balance',R(T-x.paid));b=B('Edit',`payForm(${i})`,'bk')+B('Add Payment',`payPart(${i})`)+B('Mark Completed',`payDone(${i})`)}
if(tab=='adv'){const p=x.qty-x.rec,s=x.rec>=x.qty?['FULLY RECEIVED','G']:x.rec>0?['PARTIAL','O']:['WAITING','R'];t=x.sup;chip=`<span class="chip ${s[1]}">${s[0]}</span>`;g=(x.mat?tl('Material',x.mat):'')+tl('Size',x.size||'-')+tl('Ordered',x.qty)+tl('Advance paid',R(x.amt))+tl('Received',x.rec)+tl('Pending',p);b=B('Edit',`advForm(${i})`,'bk')+B('Material Received',`advRecv(${i})`)}
return`<div class="card"><div class=ch><div class=ct>${e(t)}</div><div class=cr><div class=dt>${fd(x.date)}</div>${chip}</div></div><div class=tg>${g}</div>${h?'':`<div class=bt>${b}</div>`}</div>`}
function th(){S.theme=S.theme=='light'?'dark':S.theme=='dark'?'':'light';save();render()}
function render(){document.documentElement.style.fontSize=S.fs+'px';
if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme;
$('#ttl').textContent=S.name||'Business Manager';
$('#th').textContent=S.theme=='light'?'☀️':S.theme=='dark'?'🌙':'🌓';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
const L=S[tab],act=L.filter(x=>!x.done);let s;
if(tab=='inv')s=['Inventory Value',R(L.reduce((a,x)=>a+x.units*x.price,0))];
if(tab=='pay')s=['Pending Amount',R(act.reduce((a,x)=>a+x.units*x.rate-x.paid,0))];
if(tab=='adv')s=['Advance for Material',R(act.reduce((a,x)=>a+x.amt*(x.qty-x.rec)/x.qty,0))];
$('#sum').innerHTML='<div class=sl>'+s[0]+'</div><div class=sv>'+s[1]+'</div>';const n={inv:['Add Item','invForm()'],pay:['Add Payment','payForm()'],adv:['Add Advance','advForm()']}[tab];
$('#bar').innerHTML='<button class=fab aria-label="'+n[0]+'" onclick="'+n[1]+'">+</button>'+'<button class="g ic" aria-label="History" onclick="showH=!showH;render()">'+(showH?'←':IH)+'</button>';list()}
const lc=l=>{const k=l.indexOf(' — '),t=l.slice(0,k).replace(/^(\d+\/\d+\/)\d\d(\d\d), (\d+:\d+):\d+/,'$1$2, $3'),g=l.slice(k+3),c=/^(ADDED|STOCK IN|RECEIVED|COMPLETED|FULLY)/.test(g)?'G':/^(REMOVED|STOCK OUT)/.test(g)?'R':'O';return`<div class="card"><div class=ht>${e(t)}</div><div class="${c}">${e(g)}</div></div>`};
function list(){const L=S[tab],m=x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase());let h='';
if(!showH){const a=L.map((x,i)=>i).filter(i=>!L[i].done&&m(L[i]));h=a.map(i=>card(i)).join('')||'<p>Nothing here yet. Tap the Add button.</p>'}
else{const d=L.map((x,i)=>i).filter(i=>L[i].done&&m(L[i]));h=d.map(i=>card(i,1)).join('')+(S.log[tab].filter(m).map(lc).join('')||'<p>No history yet.</p>')}
$('#list').innerHTML=h}
// ===== BACKUP: copy text to save, paste text to restore =====
function bk(){const m=$('#m');m.innerHTML=`<div class=box><h2>Backup</h2><p>Copy this text and save it (WhatsApp / Notes). To restore, paste a saved backup here and tap Restore.</p><textarea id=bt rows=8></textarea><p id=err class=err></p><button id=cp>Copy</button><button id=rs class=g>Restore</button><button id=no class=g>Close</button></div>`;m.style.display='flex';
$('#bt').value=JSON.stringify(S);$('#no').onclick=()=>m.style.display='none';
$('#cp').onclick=()=>{$('#bt').select();try{document.execCommand('copy');err('Copied')}catch(x){err('Press and hold the text to copy')}};
$('#rs').onclick=()=>{try{const x=JSON.parse($('#bt').value);if(!x.inv||!x.pay||!x.adv)throw 0;S=Object.assign({fs:18},x);save();m.style.display='none';render()}catch(x){err('Invalid backup text')}}}
function askName(first){form(first?'Welcome! Enter your name':'Change name',[['name','Your name','text',1]],{name:S.name||''},o=>{S.name=o.name.charAt(0).toUpperCase()+o.name.slice(1)});if(first)$('#no').style.display='none'}
render();if(!S.name)askName(1);
</script></body></html>
